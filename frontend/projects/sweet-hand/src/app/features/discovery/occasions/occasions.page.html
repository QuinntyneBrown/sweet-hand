<div class="page-intro">
  <h1 i18n="@@occasions.title">Occasions</h1>
  <p class="subtitle" i18n="@@occasions.subtitle">Find a caterer for the day you’re planning.</p>
</div>
<sh-loading-status [loading]="busy()" loadingLabel="Loading occasions" i18n-loadingLabel="@@occasions.loading" />
@if (failure(); as f) {
  <sh-empty-state
    tone="error"
    heading="We couldn’t load occasions"
    i18n-heading="@@occasions.error.title"
    text="Something went wrong on our side."
    i18n-text="@@occasions.error.text"
    [reference]="f.reference"
    referenceLabel="Reference"
    i18n-referenceLabel="@@system.reference"
  >
    <svg slot="icon" shIcon="danger"></svg>
    <sh-button slot="actions" variant="primary" (activated)="tiles.reload()"><svg shIcon="refresh"></svg><ng-container i18n="@@common.tryAgain">Try again</ng-container></sh-button>
    <sh-button-anchor slot="actions" href="/caterers"><ng-container i18n="@@occasions.error.browse">Browse all caterers</ng-container></sh-button-anchor>
  </sh-empty-state>
} @else {
  <sh-caterer-grid variant="occasions" [busy]="busy()" [skeletonCount]="8" [eagerCount]="{ xs: 2, sm: 3, lg: 4 }">
    @for (o of list(); track o.id) {
      <li>
        <sh-caterer-card
          variant="occasion"
          [href]="'/caterers?occasion=' + o.id"
          [name]="o.name"
          [meta]="countText(o.count)"
          [photo]="o.photo"
          failedLabel="Photo unavailable"
          i18n-failedLabel="@@photo.unavailable"
        />
      </li>
    }
  </sh-caterer-grid>
}
