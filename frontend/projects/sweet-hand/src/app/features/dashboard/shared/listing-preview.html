<sh-caterer-card
  [href]="href()"
  [name]="card().name"
  [cuisine]="card().cuisine"
  [area]="card().area"
  [photo]="card().photo"
  loading="eager"
  placeholderLabel="Cover photo"
  i18n-placeholderLabel="@@preview.coverPhoto"
  failedLabel="Photo unavailable"
  i18n-failedLabel="@@preview.photoFailed"
/>
