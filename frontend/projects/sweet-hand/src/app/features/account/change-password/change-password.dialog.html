<sh-dialog
  [open]="open()"
  size="form"
  [form]="true"
  title="Change password"
  i18n-title="@@changePassword.title"
  [description]="lastChanged()"
  closeLabel="Close"
  i18n-closeLabel="@@common.close"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@common.cancel"
  [busy]="state.busy()"
  [busyMessage]="changing"
  [returnFocus]="returnFocus()"
  (dismissed)="closed.emit()"
  (submitted)="change()"
>
  @if (state.failed()) {
    <sh-alert tone="danger" live="assertive" title="Your password wasn’t changed" i18n-title="@@changePassword.failedTitle"
      ><ng-container i18n="@@changePassword.failedText">Something went wrong on our side. Your old password still works; try again.</ng-container></sh-alert
    >
  }
  <sh-form-summary [heading]="summaryTitle()" [headingLevel]="3" [items]="summary()" [attempt]="state.attempt()" summaryId="password-summary" />
  <div [formGroup]="form" style="display: contents">
    <sh-form-field label="Current password" i18n-label="@@changePassword.current" controlId="current" [error]="state.errors().current">
      <sh-text-field formControlName="current" type="password" name="current" autocomplete="current-password" [readonly]="state.busy()" />
    </sh-form-field>
    <sh-form-field label="New password" i18n-label="@@field.newPassword" controlId="new" [error]="state.errors().new" help="12 to 128 characters. Avoid common passwords." i18n-help="@@changePassword.newHelp">
      <sh-text-field formControlName="new" type="password" name="new" autocomplete="new-password" [readonly]="state.busy()" />
    </sh-form-field>
    <sh-form-field label="Confirm new password" i18n-label="@@changePassword.confirm" controlId="confirm" [error]="state.errors().confirm">
      <sh-text-field formControlName="confirm" type="password" name="confirm" autocomplete="new-password" [readonly]="state.busy()" />
    </sh-form-field>
  </div>
  <sh-private-note icon="shield" text="You’ll stay signed in here. Your other devices will be signed out." i18n-text="@@changePassword.note" />
  <sh-button slot="footer" type="submit" variant="primary" [busy]="state.busy()"><ng-container i18n="@@changePassword.submit">Change password</ng-container></sh-button>
</sh-dialog>
