<sh-dialog
  [open]="open()"
  [title]="title()"
  [description]="description()"
  [photo]="photo()"
  [form]="true"
  closeLabel="Close"
  i18n-closeLabel="@@common.close"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@common.cancel"
  [busy]="state.busy()"
  [busyMessage]="busyMessage()"
  [returnFocus]="returnFocus()"
  (dismissed)="dismissed.emit()"
  (submitted)="approve()"
>
  @if (conflict(); as c) {
    <sh-alert tone="warning" live="assertive" title="This profile changed while you were looking" i18n-title="@@decision.conflictTitle">{{ c }}</sh-alert>
  } @else if (state.failed()) {
    <sh-alert tone="danger" live="assertive" [title]="failedTitle()">{{ failedText() }}</sh-alert>
  }
  <sh-checklist [statusLabels]="checkLabels">
    @for (line of lines(); track $index) {
      <li sh-checklist-item status="done">{{ line }}</li>
    }
  </sh-checklist>
  @if (conflict()) {
    <sh-button-anchor slot="footer" variant="primary" [href]="paths.admin.queue"><ng-container i18n="@@review.backToQueue">Back to review queue</ng-container></sh-button-anchor>
  } @else {
    <button
      slot="footer"
      class="btn btn--primary"
      type="submit"
      autofocus
      [attr.aria-busy]="state.busy() ? 'true' : null"
      [attr.aria-disabled]="state.busy() ? 'true' : null"
    >
      {{ state.failed() ? tryAgain : submitLabel() }}
    </button>
  }
</sh-dialog>
