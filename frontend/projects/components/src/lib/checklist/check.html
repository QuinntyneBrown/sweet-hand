@switch (status()) {
  @case ('done') {
    <span class="check check--done" aria-hidden="true"><svg shIcon="check"></svg></span>
  }
  @case ('attention') {
    <span class="check check--error" aria-hidden="true"><svg shIcon="exclamation"></svg></span>
  }
  @default {
    <span class="check" aria-hidden="true"></span>
  }
}
