<div class="browse">
  <div class="browse__title">
    <h1 i18n="@@listing.title">Caterers</h1>
    <p class="result-count" role="status" aria-live="polite">
      @if (view(); as v) {
        <ng-container i18n="@@listing.resultCount">{v.total, plural, =1 {1 caterer} other {{{v.total}} caterers}}</ng-container>
      }
    </p>
  </div>

  <aside class="browse__aside" aria-label="Filters" i18n-aria-label="@@filters.title">
    <sh-filter-group
      title="Cuisine"
      i18n-title="@@filters.cuisine"
      allLabel="All"
      i18n-allLabel="@@filters.all"
      [allHref]="allCuisinesHref()"
      [options]="cuisines()"
      [moreLabel]="moreCuisines"
      fewerLabel="Fewer cuisines"
      i18n-fewerLabel="@@filters.fewerCuisines"
      [countNoun]="caterersNoun"
      (toggled)="toggleCuisine($event)"
    />
    <sh-filter-group title="Area" i18n-title="@@filters.area" [options]="areas()" [countNoun]="caterersNoun" (toggled)="toggleArea($event)" />
  </aside>

  <section class="browse__results" aria-labelledby="results-title">
    <h2 #resultsHeading class="visually-hidden" id="results-title" tabindex="-1" i18n="@@listing.results">Results</h2>
    <div class="browse__head" [class.until-lg]="!chips().length">
      <sh-active-filters
        label="Active filters"
        i18n-label="@@filters.active"
        [chips]="chips()"
        [removeLabel]="removeFilterLabel"
        clearLabel="Clear filters"
        i18n-clearLabel="@@filters.clear"
        clearHref="/caterers"
        (removed)="removeChip($event)"
        (emptied)="focusResults()"
      />
    </div>
    @if (noResults(); as text) {
      <sh-empty-state heading="No caterers match these filters" i18n-heading="@@listing.noResults.title" [headingLevel]="3" [text]="text">
        <svg slot="icon" shIcon="search"></svg>
        <sh-button-anchor slot="actions" variant="primary" href="/caterers"><ng-container i18n="@@filters.clear">Clear filters</ng-container></sh-button-anchor>
      </sh-empty-state>
    } @else {
      <sh-caterer-grid [busy]="listing.isLoading()">
        @for (c of view()?.items ?? []; track c.slug) {
          <li>
            <sh-caterer-card
              [href]="'/caterers/' + c.slug"
              [name]="c.name"
              [cuisine]="c.primaryCuisine"
              [area]="c.primaryArea"
              [photo]="c.cover"
              failedLabel="Photo unavailable"
              i18n-failedLabel="@@photo.unavailable"
            />
          </li>
        }
      </sh-caterer-grid>
    }
    @if (view(); as v) {
      <sh-pagination
        [page]="v.page"
        [pageCount]="v.pageCount"
        [hrefFor]="hrefFor"
        [summary]="summary()"
        label="Pagination"
        i18n-label="@@pagination.label"
        previousLabel="Previous page"
        i18n-previousLabel="@@pagination.previous"
        nextLabel="Next page"
        i18n-nextLabel="@@pagination.next"
        [pageLabel]="pageLabel"
      />
    }
  </section>
</div>
