<section class="caterer-section" id="reviews" aria-labelledby="reviews-title">
  @if (rating().count > 0) {
    <div class="caterer-section__head">
      <h2 id="reviews-title" i18n="@@reviews.title">Reviews</h2>
      <sh-rating-summary [average]="rating().average" [count]="rating().count" [countLabel]="countLabel(rating().count)" />
    </div>
    <sh-review-list listId="review-list" [busy]="loading()">
      @for (r of reviews(); track r.id) {
        <sh-review
          [author]="r.author"
          [eventLabel]="eventLabel(r.eventMonth)"
          [editedLabel]="r.edited ? editedText : null"
          [rating]="r.rating"
          [ratingLabel]="ratingLabel(r.rating)"
          [body]="r.text"
          [response]="r.response ? { label: responseLabel(catererName()), body: r.response.text } : null"
        />
      }
    </sh-review-list>
    @if (!loading() && page() < pageCount()) {
      <p class="show-more">
        <sh-button controls="review-list" [busy]="loadingMore()" (activated)="showMore()"><ng-container i18n="@@reviews.showMore">Show more reviews</ng-container></sh-button>
      </p>
    }
    <p class="visually-hidden" role="status">{{ announcement() }}</p>
  } @else {
    <h2 id="reviews-title" i18n="@@reviews.title">Reviews</h2>
    <p class="text-muted no-reviews" i18n="@@reviews.none">No reviews yet</p>
    <p class="text-subtle text-sm no-reviews__note" i18n="@@reviews.noneNote">Reviews come from customers after their event.</p>
  }
</section>
