name: Feature request
description: Suggest an idea that would help makers or eaters.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe it from a maker's, eater's or operator's point of view.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Mock-ups, examples from other products, or links.
