name: Deploy staging

# Every green commit on main goes to staging.sweethand.ca (L2-109.1).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/deliver.yml
    with:
      environment: staging
      env-name: staging
      resource-group: rg-sweethand-staging
      sha: ${{ github.event.workflow_run.head_sha }}
      site-hostnames: staging.sweethand.ca
      parameters: '{"postgresBackupRetentionDays": 7, "postgresGeoRedundantBackup": false, "budgetAmount": 60}'
    secrets: inherit
