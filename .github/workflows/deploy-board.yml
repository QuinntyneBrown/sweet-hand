name: Deploy board

# Every push to main publishes the founder's sprint board, built from that commit's
# docs/plans/launch-backlog.md, to a public Free-tier Azure Static Web App (ADR 0014).
# Nothing to set up: it signs in as the staging deployer that already exists, creates the
# app in the staging resource group the first time, and uploads the build. Run it by hand
# to republish the current main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.swa.outputs.url }}
    env:
      RESOURCE_GROUP: rg-sweethand-staging
      STATIC_WEB_APP: swa-sweethand-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the board from the backlog
        working-directory: frontend
        run: |
          npm ci
          npm run build:board
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create the Static Web App the first time
        run: |
          if ! az staticwebapp show -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --only-show-errors > /dev/null 2>&1; then
            az staticwebapp create -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --location eastus2 --sku Free --only-show-errors > /dev/null \
              || { echo "::error::Could not create $STATIC_WEB_APP. Azure allows ten Free static sites per subscription: list them with az staticwebapp list --query \"[?sku.name=='Free'].{name:name, resourceGroup:resourceGroup}\" -o table, delete one, then re-run this workflow."; exit 1; }
          fi
      - name: Read the deployment token and address
        id: swa
        run: |
          echo "token=$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --query properties.apiKey -o tsv)" >> "$GITHUB_OUTPUT"
          echo "url=https://$(az staticwebapp show -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --query defaultHostname -o tsv)" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist/board/browser
          skip_app_build: true
          skip_api_build: true
      - run: echo "The board is live at ${{ steps.swa.outputs.url }}/"
