name: Deploy board

# Every push to main publishes the founder's sprint board, built from that commit's
# docs/plans/launch-backlog.md, to its Azure Static Web App (ADR 0014). The only setup is
# the Static Web App's deployment token in the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN_BOARD. Run it by hand to republish the current main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the board from the backlog
        working-directory: frontend
        run: |
          npm ci
          npm run build:board
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BOARD }}
          action: upload
          app_location: frontend/dist/board/browser
          skip_app_build: true
          skip_api_build: true
