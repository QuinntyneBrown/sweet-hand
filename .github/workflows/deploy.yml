name: Deploy production

# A release tag (v1.4.0) goes to sweethand.ca only when that exact commit was
# accepted in UAT, and only after a required reviewer approves the production
# environment (L2-109.3). Running this workflow by hand from an earlier release
# tag redeploys that release (L2-109.7).

on:
  push:
    tags: ['v*.*.*', '!v*.*.*-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release tag whose commit deployed to UAT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production deploys only from a release tag (vMAJOR.MINOR.PATCH); $GITHUB_REF_NAME is not one"; exit 1
          fi
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=uat&sha=$GITHUB_SHA&per_page=100" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" --jq 'any(.[]; .state == "success")')" = true ]; then exit 0; fi
          done
          echo "::error::$GITHUB_SHA never deployed successfully to UAT; push a release candidate tag on it first"; exit 1

  production:
    needs: gate
    uses: ./.github/workflows/deliver.yml
    with:
      environment: production
      env-name: prod
      resource-group: rg-sweethand-prod
      sha: ${{ github.sha }}
      site-hostnames: sweethand.ca,www.sweethand.ca
      custom-email-domain: true
      register-hostnames: false
    secrets: inherit
