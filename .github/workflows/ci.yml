name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Backend acceptance tests and type check
        run: |
          npm test --prefix backend
          npm run typecheck --prefix backend
      - name: Frontend lint, type check and builds
        run: |
          npm run lint --prefix frontend
          npm run lint:launch --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          npm run build:launch --prefix frontend
      - name: Verify extracted messages are current
        run: |
          npm run extract-i18n --prefix frontend
          npm run extract-i18n:launch --prefix frontend
          git diff --exit-code -- frontend/projects/sweet-hand/src/locale frontend/projects/launch/src/locale
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Chromium acceptance tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - name: Build production container
        run: docker build -f backend/Dockerfile -t sweet-hand-api:${{ github.sha }} .
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: sweet-hand-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify the container runs without root
        run: test "$(docker image inspect sweet-hand-api:${{ github.sha }} --format '{{.Config.User}}')" = node

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
