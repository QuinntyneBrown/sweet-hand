<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<title>Sweet Hand sticker — Wordmark badge</title>
<link rel="stylesheet" href="stickers.css">
</head>
<body>
<div class="stage">
  <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" style="--cut-extra: 130px">
    <title>Sweet Hand wordmark badge</title>
    <defs>
      <!-- Edge URL, centred in the rim under the badge: the badge bottom is
           y 640, the rim runs to y 705, so the cap tops sit 24px clear of the art. -->
      <path id="urlLine" fill="none" d="M 250 685 L 650 685" />
    </defs>

    <!-- Die-cut silhouette -->
    <g>
      <rect class="keyline" x="80" y="260" width="740" height="380" rx="190" />
    </g>

    <!-- Badge -->
    <rect x="80" y="260" width="740" height="380" rx="190" fill="#141312" />
    <text class="wm" x="450" y="470" text-anchor="middle" font-size="112" fill="#ffffff">Sweet Hand<tspan fill="#c94a2f">.</tspan></text>
    <rect x="395" y="505" width="110" height="10" rx="5" fill="#c94a2f" />
    <text x="450" y="572" text-anchor="middle" font-family="Figtree" font-weight="500" font-size="36" fill="#e2ded7">Toronto and the GTA</text>

    <text class="edge-url" text-anchor="middle"><textPath href="#urlLine" startOffset="50%">SWEETHAND.CA</textPath></text>
  </svg>
</div>
</body>
</html>
